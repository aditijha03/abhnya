<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Examples</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;600&family=Montserrat:wght@300;400;500&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #171717;
      color: white;
      margin: 0;
      padding: 50px;
      display: flex;
      flex-direction: column;
      gap: 80px;
    }
    .example {
      padding-bottom: 40px;
      border-bottom: 1px solid #333;
    }
    .label {
      font-family: sans-serif;
      color: #E3C096;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .heading {
      font-size: 80px;
      line-height: 1.1;
      margin: 0;
    }
    .script {
      font-family: 'Great Vibes', cursive;
      color: #E3C096;
      display: block;
    }
    /* Font classes */
    .font-playfair { font-family: 'Playfair Display', serif; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .font-montserrat { font-family: 'Montserrat', sans-serif; font-weight: 300; }
    .font-cormorant { font-family: 'Cormorant Garamond', serif; }
  </style>
</head>
<body>

  <div class="example">
    <div class="label">1. Playfair Display (Classic Vogue Serif)</div>
    <h1 class="heading font-playfair">
      Celebrate<br>
      <span class="script">Your Love Story</span>
    </h1>
  </div>

  <div class="example">
    <div class="label">2. Cinzel (Majestic Roman Serif)</div>
    <h1 class="heading font-cinzel">
      Celebrate<br>
      <span class="script">Your Love Story</span>
    </h1>
  </div>

  <div class="example">
    <div class="label">3. Cormorant Garamond (Elegant Romantic Serif)</div>
    <h1 class="heading font-cormorant">
      Celebrate<br>
      <span class="script">Your Love Story</span>
    </h1>
  </div>

  <div class="example">
    <div class="label">4. Montserrat (Modern Minimalist Geometric)</div>
    <h1 class="heading font-montserrat">
      Celebrate<br>
      <span class="script">Your Love Story</span>
    </h1>
  </div>

</body>
</html>
